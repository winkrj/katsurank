name: Backend Test

on:
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: katsurank
          POSTGRES_USER: katsurank
          POSTGRES_PASSWORD: katsurank_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katsurank -d katsurank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        working-directory: backend
        run: ./gradlew test
