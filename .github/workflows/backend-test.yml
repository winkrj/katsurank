name: Backend Test

on:
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: katsurank
          POSTGRES_USER: katsurank
          POSTGRES_PASSWORD: katsurank_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katsurank -d katsurank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        id: gradle_test
        working-directory: backend
        run: ./gradlew test --stacktrace
        continue-on-error: true

      - name: Show failing test details
        if: steps.gradle_test.outcome == 'failure'
        working-directory: backend
        run: |
          for f in build/test-results/test/*.xml; do
            if grep -qE 'failures="[1-9]|errors="[1-9]' "$f"; then
              echo "=== $(basename "$f") ==="
              grep -o 'message="[^"]*"' "$f" | sort -u | head -5
            fi
          done

      - name: Fail job if tests failed
        if: steps.gradle_test.outcome == 'failure'
        run: exit 1
