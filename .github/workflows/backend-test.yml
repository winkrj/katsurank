name: Backend Test

on:
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: katsurank
          POSTGRES_USER: katsurank
          POSTGRES_PASSWORD: katsurank_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katsurank -d katsurank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        id: gradle_test
        working-directory: backend
        env:
          # postgres 서비스 컨테이너 자격 증명과 명시적으로 맞춤 (application-local.yml 값에 암묵적으로 기대지 않음)
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/katsurank
          SPRING_DATASOURCE_USERNAME: katsurank
          SPRING_DATASOURCE_PASSWORD: katsurank_local
        run: ./gradlew test --stacktrace
        continue-on-error: true

      - name: Show failing test details
        if: steps.gradle_test.outcome == 'failure'
        working-directory: backend
        run: |
          f=$(grep -lE 'failures="[1-9]|errors="[1-9]' build/test-results/test/*.xml | head -1)
          echo "=== full contents of $f ==="
          cat "$f"

      - name: Fail job if tests failed
        if: steps.gradle_test.outcome == 'failure'
        run: exit 1
