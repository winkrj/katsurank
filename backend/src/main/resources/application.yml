# =========================================================
# 공통 설정 (모든 프로파일 공유)
# 프로파일별 값은 application-local.yml / application-prod.yml 참조.
# 기본 활성 프로파일은 local. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
# =========================================================
spring:
  application:
    name: katsurank

  profiles:
    active: local

  # 가상 스레드 (Java 21) — I/O 대기 많은 폴링·카카오 API 워크로드에 유효
  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false        # OSIV 끔 — 영속성 컨텍스트를 트랜잭션 경계로 한정
    hibernate:
      ddl-auto: validate       # 스키마는 Flyway가 관리. Hibernate는 검증만 (ddl-auto 의존 금지)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC        # 시각은 UTC로 저장, 표시 시점에만 KST 변환

  # 스키마 관리 — Flyway (db/migration/V*.sql)
  flyway:
    enabled: true
    locations: classpath:db/migration

  # 캐시 — 인메모리 Caffeine (Redis 불필요). 카카오 로컬 API 검색 응답 캐시.
  cache:
    type: caffeine
    cache-names: kakaoPlaceSearch
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

  # 외부저장소 세션 — spring-session-jdbc (JWT 미채택)
  # 세션 테이블은 Flyway(V2__spring_session.sql)로 관리하므로 자동 생성 끔.
  session:
    store-type: jdbc
    timeout: 14d
    jdbc:
      initialize-schema: never

  # 카카오 OAuth2 — 비밀값은 환경변수로 주입(커밋 금지). 로컬 기본값은 부팅용 더미.
  # 동의 항목은 최소(profile_nickname/profile_image)만. 이메일 수집 금지.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 인증·보안 환경 설정 (com.katsurank.config.AppProperties)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    domain: ${APP_COOKIE_DOMAIN:}
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

# 카카오 로컬 API (가게 검색) — REST API 키는 환경변수로 주입(커밋 금지)
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:local-kakao-rest-api-key}
  local-api-base-url: https://dapi.kakao.com

ranking:
  cache:
    enabled: ${RANKING_CACHE_ENABLED:true}
    refresh-delay: 1s

# 리버스 프록시(Railway 등) 뒤에서 X-Forwarded-* 신뢰
server:
  forward-headers-strategy: framework

# 관측 — Actuator + Micrometer (Prometheus 노출)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: katsurank

logging:
  level:
    root: INFO
