spring:
  application:
    name: katsurank

  datasource:
    url: jdbc:postgresql://localhost:5432/katsurank
    username: katsurank
    password: katsurank_local
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # 초기 개발용. Flyway 도입 시 validate 로 변경
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false   # OSIV 끔 — 1인 개발이라도 권장 디폴트

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  thymeleaf:
    cache: false   # 개발용

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# 카츠랭 자체 설정
katsurank:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    local-search-url: https://dapi.kakao.com/v2/local/search/keyword.json
  restaurant:
    allowed-category-keywords:
      - 돈까스
      - 돈가스
      - 경양식
