services:
  postgres:
    image: postgres:16-alpine
    container_name: katsurank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: katsurank
      POSTGRES_USER: katsurank
      POSTGRES_PASSWORD: katsurank_local
    ports:
      - "5432:5432"
    volumes:
      - katsurank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katsurank -d katsurank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  katsurank_pgdata:
