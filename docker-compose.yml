services:
  postgres:
    image: postgres:16-alpine
    container_name: katsurank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: katsurank
      POSTGRES_USER: katsurank
      POSTGRES_PASSWORD: katsurank_local
    ports:
      - "5432:5432"
    volumes:
      - katsurank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katsurank -d katsurank"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: katsurank-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./backend/loadtest/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - katsurank_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    container_name: katsurank-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/loadtest/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/loadtest/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - katsurank_grafana_data:/var/lib/grafana

volumes:
  katsurank_pgdata:
  katsurank_prometheus_data:
  katsurank_grafana_data:
